name: monokek

# Client id monokek-identity registers for monokek-spring's client_credentials calls
# (see that service's ClientSeeder) — referenced by both monokek-identity's and
# monokek-spring's own env blocks below via the anchor, so the two can't silently
# drift apart the way two separate literals could.
x-monokek-spring-client-id: &monokek_spring_client_id monokek-spring-service

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MONOKEK_DB_NAME: ${MONOKEK_DB_NAME}
      MONOKEK_DB_USERNAME: ${MONOKEK_DB_USERNAME}
      MONOKEK_DB_PASSWORD: ${MONOKEK_DB_PASSWORD}
      PMS_DB_NAME: ${PMS_DB_NAME}
      PMS_DB_USERNAME: ${PMS_DB_USERNAME}
      PMS_DB_PASSWORD: ${PMS_DB_PASSWORD}
      # Read by deploy/mysql/init/01-init-databases.sh, which runs inside this
      # container on first boot (empty volume) — without these, that script
      # aborts on the unset variable (set -u) and the whole stack's first
      # bring-up fails.
      IDENTITY_DB_USERNAME: ${IDENTITY_DB_USERNAME}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  # Object storage (product images, store logo). SeaweedFS in single-container mode
  # (master + volume + filer + S3 gateway). Replaces MinIO: same S3 API, so monokek-spring's
  # MinIO SDK client and the "mc" backup job keep working unchanged against port 8333.
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-latest}
    restart: unless-stopped
    # The S3 identities file is generated at start from the env credentials (weed can't expand
    # env vars in it). "anonymous" = unauthenticated read, which is what Caddy's /media/* route
    # relies on; all writes need the access key. Only Caddy/monokek-spring/backup can reach 8333
    # (not published), and Caddy itself only forwards GET/HEAD.
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[
          {"name":"monokek","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]},
          {"name":"anonymous","actions":["Read"]}
        ]}
        EOF
        exec weed server -dir=/data -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - seaweedfs-data:/data
    # No ports published: the S3 API (8333), master (9333) and filer (8888) are reached as
    # seaweedfs:<port> on the Docker network only; clients read files via Caddy's /media/*.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  # Central identity provider (user management + OAuth2/OIDC authentication),
  # extracted out of monokek-spring so its uptime never affects pms-modulith's
  # ability to validate tokens — see monokek-identity/README and the plan this
  # was built from. Connects to the SAME schema as monokek-spring (MONOKEK_DB_NAME)
  # with its own, narrower-privileged DB user — see deploy/mysql/init.
  monokek-identity:
    image: docker.io/${DOCKERHUB_NAMESPACE}/monokek-identity:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      # monokek-spring's own V1 Flyway migration is what creates the shared
      # users/roles/permissions/user_roles/user_permissions tables in this same
      # schema (see the comment above) — on a fresh empty database, starting
      # monokek-identity before that migration has run lets its own Flyway/Hibernate
      # touch the schema first, which makes monokek-spring's Flyway see a non-empty
      # schema and baseline-on-migrate past V1 instead of running it, permanently
      # breaking the schema (roles/users never get created). Waiting for healthy
      # here (not just started) ensures monokek-spring's migration has actually
      # completed first.
      monokek-spring:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MONOKEK_DB_NAME}
      DB_USERNAME: ${IDENTITY_DB_USERNAME}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      SERVER_PORT: 8082
      # Same value as monokek-spring's own CORS_ALLOWED_ORIGINS below — Caddy proxies
      # /api/login, /api/logout, /api/me, /api/auth/**, /api/admin/staff/** straight to
      # this service (see the Caddyfile), so it needs its own CORS config for those
      # browser-facing routes, distinct from monokek-spring's.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Public base URL clients see (through Caddy) — must match the LAN address
      # used for CADDY_PUBLIC_URL below. A mismatch here breaks JWKS/issuer
      # discovery for any client that validates the "iss" claim against it.
      IDENTITY_ISSUER: ${IDENTITY_ISSUER}
      # One-time-generated keypair so tokens survive redeploys — see deploy/README
      # for the openssl one-liner to generate these. Leaving them unset works (an
      # ephemeral keypair is generated at boot) but invalidates every outstanding
      # token on every restart.
      IDENTITY_RSA_PRIVATE_KEY_PEM: ${IDENTITY_RSA_PRIVATE_KEY_PEM}
      IDENTITY_RSA_PUBLIC_KEY_PEM: ${IDENTITY_RSA_PUBLIC_KEY_PEM}
      IDENTITY_POS_CLIENT_ID: monokek-pos
      IDENTITY_POS_CLIENT_SECRET: ${IDENTITY_POS_CLIENT_SECRET}
      IDENTITY_MONOKEK_SPRING_CLIENT_ID: *monokek_spring_client_id
      IDENTITY_MONOKEK_SPRING_CLIENT_SECRET: ${IDENTITY_MONOKEK_SPRING_CLIENT_SECRET}
      IDENTITY_INTERNAL_CLIENT_ID: monokek-identity-internal
      IDENTITY_INTERNAL_CLIENT_SECRET: ${IDENTITY_INTERNAL_CLIENT_SECRET}
      # Container-to-container: HttpActivityNotifier's webhook target.
      MONOKEK_SPRING_API_URL: http://monokek-spring:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/oauth2/jwks"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  monokek-spring:
    image: docker.io/${DOCKERHUB_NAMESPACE}/monokek-spring:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      # No dependency on monokek-identity: this app boots fine even if
      # monokek-identity isn't up yet (JWKS is fetched lazily, on first token
      # validation). It's actually the other way around — monokek-identity depends
      # on THIS service being healthy first, since monokek-spring's own V1 Flyway
      # migration is what creates the shared users/roles/etc. tables in this
      # schema (see monokek-identity's depends_on above for why the ordering
      # matters on a fresh database).
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MONOKEK_DB_NAME}
      DB_USERNAME: ${MONOKEK_DB_USERNAME}
      DB_PASSWORD: ${MONOKEK_DB_PASSWORD}
      # Container-to-container: monokek-spring validates tokens against
      # monokek-identity's JWKS and calls its /internal/users — no shared secret
      # anymore, and no reference to pms-modulith either way (see the plan).
      IDENTITY_JWK_SET_URI: http://monokek-identity:8082/oauth2/jwks
      # NOT the internal http://monokek-identity:8082 address: every token's "iss" claim
      # is stamped with monokek-identity's own IDENTITY_ISSUER (the public Caddy URL,
      # see that service's env block above) since that's what issued it — this must be
      # the exact same value for jwtDecoder's issuer check to ever pass.
      IDENTITY_ISSUER: ${IDENTITY_ISSUER}
      IDENTITY_API_URL: http://monokek-identity:8082
      IDENTITY_TOKEN_URI: http://monokek-identity:8082/oauth2/token
      IDENTITY_MONOKEK_SPRING_CLIENT_ID: *monokek_spring_client_id
      IDENTITY_MONOKEK_SPRING_CLIENT_SECRET: ${IDENTITY_MONOKEK_SPRING_CLIENT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ALLOW_DEFAULT_SECRETS: "false"
      MINIO_ENDPOINT: http://seaweedfs:8333
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      # Path Caddy exposes the bucket under: uploads are stored as "/media/<bucket>/<key>" (no host
      # baked in) and responses are completed with the origin each client used to reach us.
      MEDIA_BASE_PATH: ${MEDIA_BASE_PATH:-/media}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY}
      SERVER_PORT: 8080
      # Container-to-container: Docker's own DNS resolves this regardless of
      # the LAN address the server itself is reached at.
      PMS_API_URL: http://pms-modulith:8081/api/v1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  pms-modulith:
    image: docker.io/${DOCKERHUB_NAMESPACE}/pms-modulith:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      # Same reasoning as monokek-spring's dependency above — and note this app
      # has NO dependency, direct or config, on monokek-spring at all: a
      # monokek-spring outage has zero effect on pms-modulith.
      monokek-identity:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${PMS_DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${PMS_DB_USERNAME}
      DB_PASSWORD: ${PMS_DB_PASSWORD}
      IDENTITY_JWK_SET_URI: http://monokek-identity:8082/oauth2/jwks
      # Same value as monokek-identity's own IDENTITY_ISSUER (the public Caddy URL) —
      # see monokek-spring's identical env var above for why this can't be the internal
      # http://monokek-identity:8082 address.
      IDENTITY_ISSUER: ${IDENTITY_ISSUER}
      CHANNEL_MANAGER_WEBHOOK_TOKEN: ${CHANNEL_MANAGER_WEBHOOK_TOKEN}
      PMS_CORS_ALLOWED_ORIGINS: ${PMS_CORS_ALLOWED_ORIGINS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/v3/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  backup:
    image: docker.io/${DOCKERHUB_NAMESPACE}/monokek-backup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      monokek-spring:
        # Waits for monokek-spring's bucket-init ApplicationRunner to
        # have completed, so the first backup run doesn't race it and find
        # the bucket missing yet.
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MONOKEK_DB_NAME: ${MONOKEK_DB_NAME}
      PMS_DB_NAME: ${PMS_DB_NAME}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./deploy/backups:/backups
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      # service_started, not service_healthy, for all three: Caddy's reverse_proxy
      # already retries/502s gracefully against a backend that's merely slow to
      # become healthy, so gating Caddy's own startup on "healthy" bought nothing
      # except a single point of failure — before this fix, monokek-spring never
      # becoming healthy at a stack (re)start meant Caddy itself never started
      # either, taking pms-modulith's reachability down with it even though
      # pms-modulith was perfectly healthy. Each backend's own path is still only
      # ever reverse-proxied to that one backend, so an individual outage now only
      # 502s that backend's own routes.
      monokek-spring:
        condition: service_started
      monokek-identity:
        condition: service_started
      pms-modulith:
        condition: service_started
    environment:
      # LAN IP or name clients use to reach this server — goes into the TLS certificate (SAN).
      # Required: a wrong value makes every client reject the certificate.
      CADDY_HOST: ${CADDY_HOST:?Définir CADDY_HOST dans .env (IP ou nom LAN du serveur)}
      # Full public HTTPS base URL (with port), used for the HTTP -> HTTPS redirect.
      CADDY_HTTPS_URL: ${CADDY_HTTPS_URL:?Définir CADDY_HTTPS_URL dans .env (ex. https://192.168.1.50:8443)}
    ports:
      # Reachable from other machines on the LAN. 8443 = the real (HTTPS) entrypoint; 8090 (HTTP) only
      # serves the CA certificate (/ca.crt) and /api/ping, and redirects everything else to HTTPS.
      - "8443:443"
      - "8090:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [backend]

networks:
  backend:

volumes:
  mysql-data:
  seaweedfs-data:
  caddy-data:
